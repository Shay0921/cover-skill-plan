<!-- recipe: quote01-annotated.part.html | source: p11 | 金句页 · 带注解印章档 -->
<div class="p-page" data-artwork data-size="1080x1440" data-recipe="P08">
<div class="grain" data-decoration></div><div class="wash" data-decoration></div>
<header class="page-header"><div class="brand" data-layer="brand" data-group><span class="seal" data-layer="brand-seal" data-editable="text" data-from="brand-seal">{{品牌印章字}}</span><div><div class="nm" data-layer="brand-name" data-editable="text" data-from="brand-name">{{品牌名称}}</div><div class="tg" data-layer="brand-tag" data-editable="text" data-from="brand-tag">{{品牌标语}}</div></div></div></header>
<div class="region heading" data-region="head"><h1 class="h1" data-component="h1" data-layer="headline" data-group data-editable="text" data-from="quote-headline">{{金句标题}}</h1><p class="sub" data-component="sub" data-layer="introduction" data-group data-editable="text" data-from="quote-intro">{{金句引言}}</p></div>
<main class="body"><div class="region grow justify-center gap5" data-region="full"><blockquote class="quote hero" data-component="serif" data-layer="experiment-quote" data-group><p class="serif" data-layer="experiment-quote-text" data-editable="text" data-from="quote-text">{{金句前半}}<br><span class="hl">{{金句高亮}}</span>{{金句收尾}}</p><p class="source" data-layer="experiment-quote-source" data-editable="text" data-from="quote-source">{{金句出处}}</p></blockquote><p class="text-block" data-component="text-block" data-layer="quote-explanation" data-group data-editable="text" data-from="quote-explanation">{{金句注解}}</p></div><div class="region" data-region="bottom"><p class="seal-lg" data-component="seal-lg" data-layer="closing-seal" data-group data-editable="text" data-from="closing-seal">{{收束印章字}}</p></div></main>
<footer class="footer"><span data-layer="footer-signature" data-editable="text">{{页脚签名}}</span><span class="pageno" data-layer="page-number" data-editable="text" data-numbering></span></footer>
<div class="overlay" data-region="overlay"><div class="ghost" data-component="ghost" data-layer="background-letter" data-group data-decoration>{{背景大字}}</div></div>
</div>
