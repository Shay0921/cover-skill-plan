<!-- recipe: close01-quote.part.html | source: p47 | 收尾页 · 收束金句复合档 -->
<div class="p-page" data-artwork data-size="1080x1440" data-recipe="P12">
<div class="grain" data-decoration></div><div class="wash" data-decoration></div>
<header class="page-header"><div class="brand" data-layer="brand" data-group><span class="seal" data-layer="brand-seal" data-editable="text" data-from="brand-seal">{{品牌印章字}}</span><div><div class="nm" data-layer="brand-name" data-editable="text" data-from="brand-name">{{品牌名称}}</div><div class="tg" data-layer="brand-tag" data-editable="text" data-from="brand-tag">{{品牌标语}}</div></div></div></header>
<div class="region heading" data-region="head"><h1 class="h1" data-component="h1" data-layer="headline" data-group data-editable="text" data-from="record-closing-headline">{{收尾标题前段}}<span style="display:inline-block">{{收尾标题中段}}<span class="hl">{{收尾标题重点}}</span></span></h1><p class="sub" data-component="sub" data-layer="introduction" data-group data-editable="text" data-from="record-closing-intro">{{收尾引言}}</p></div>
<main class="body"><div class="region grow justify-center gap22" data-region="full"><div class="cr" data-component="cr" data-layer="record-closing-origin" data-group><span class="k" data-layer="record-closing-origin-label" data-editable="text" data-from="closing-origin-key">{{条目标签}}<span class="en" data-layer="record-closing-origin-label-en" data-editable="text" data-from="closing-origin-en">{{条目标签英文}}</span></span><p class="d" data-layer="record-closing-origin-text" data-editable="text" data-from="closing-origin-text">{{条目说明}}</p></div><!-- repeat ×2-3: 逐条复制本单元；等高；顺序无强调 --><p class="serif" data-component="serif" data-layer="record-closing-quote" data-group data-editable="text" data-from="record-closing-line">{{收束金句前段}}<span class="hl">{{收束金句重点}}</span>{{收束金句后段}}</p></div><div class="region" data-region="bottom"><p class="cta" data-component="cta" data-layer="record-closing-action" data-group data-editable="text" data-from="next-action">{{行动指令}}</p></div></main>
<footer class="footer"><span data-layer="footer-signature" data-editable="text">{{页脚签名}}</span><span class="pageno" data-layer="page-number" data-editable="text" data-numbering></span></footer>
<div class="overlay" data-region="overlay"><div class="ghost" data-component="ghost" data-layer="background-letter" data-group data-decoration>{{背景大字}}</div></div>
</div>
