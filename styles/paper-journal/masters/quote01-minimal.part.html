<!-- recipe: quote01-minimal.part.html | source: p33 | 金句页 · 极简档 -->
<div class="p-page" data-artwork data-size="1080x1440" data-recipe="R-quote-01">
<div class="grain" data-decoration></div><div class="wash" data-decoration></div>
<header class="page-header"><div class="brand" data-layer="brand" data-group><span class="seal" data-layer="brand-seal" data-editable="text" data-from="brand-seal">{{品牌印章字}}</span><div><div class="nm" data-layer="brand-name" data-editable="text" data-from="brand-name">{{品牌名称}}</div><div class="tg" data-layer="brand-tag" data-editable="text" data-from="brand-tag">{{品牌标语}}</div></div></div></header>
<div class="region heading" data-region="head"><h1 class="h1" data-component="h1" data-layer="headline" data-group data-editable="text" data-from="divider-headline">{{章节标题}}</h1></div>
<main class="body"><div class="region grow justify-center align-center gap4" data-region="full"><blockquote class="quote hero" data-component="serif" data-layer="gold-quote" data-group><p class="serif" data-layer="gold-quote-text" data-editable="text" data-from="divider-text">{{金句前半}}<br>{{金句引入}}<span class="hl">{{金句高亮}}</span>{{金句收尾}}</p><span class="rule" data-layer="gold-quote-rule" data-decoration></span><p class="source" data-layer="gold-quote-source" data-editable="text" data-from="quote-source">{{金句出处}}</p><p class="credit" data-layer="gold-quote-credit" data-editable="text" data-from="divider-credit">{{金句注脚}}</p></blockquote></div></main>
<footer class="footer"><span data-layer="footer-signature" data-editable="text">{{页脚签名}}</span><span class="pageno" data-layer="page-number" data-editable="text" data-numbering></span></footer>
<div class="overlay" data-region="overlay"><div class="ghost" data-component="ghost" data-layer="background-letter" data-group data-decoration>{{背景大字}}</div></div>
</div>
